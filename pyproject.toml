[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "molecular-screening-workbench"
version = "0.1.0"
description = "A reproducible workflow for molecular screening data analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "biopython",
    "scikit-learn",
    "xlwt",
    "openpyxl",
    "xlsxwriter",
    "xlrd",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
